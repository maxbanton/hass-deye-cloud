set_tou_schedule:
  name: Set Time Of Use schedule
  description: >-
    Write the inverter Time Of Use schedule (the Work Mode / Time Of Use table).
    Fields match the inverter screen: Time, Power, Batt, Grid Charge, Gen.
    Give 6 slots in order; fields left out keep their current value.
  fields:
    device_id:
      name: Inverter
      description: The inverter to change. Omit if only one inverter is configured.
      required: false
      selector:
        device:
          integration: deye_cloud
    device_sn:
      name: Device serial
      description: Inverter serial, as an alternative to picking the device.
      required: false
      example: "2601234567"
      selector:
        text:
    slots:
      name: Slots
      description: >-
        List of exactly 6 slots, in order. Each slot can set time (HH:MM, 5-minute
        steps), power (W), batt (%), grid_charge (true/false), gen (true/false) and
        sell (true/false). Fields left out, or an empty slot {}, keep their current
        value.
      required: true
      example: >-
        [{"time":"01:00","batt":90,"grid_charge":true},
        {"time":"05:00","batt":50}, {}, {}, {},
        {"time":"21:00","batt":90,"grid_charge":true}]
      selector:
        object:

set_tou_days:
  name: Set Time Of Use on/off and days
  description: Enable or disable Time Of Use, optionally limited to weekdays.
  fields:
    device_sn:
      name: Device serial
      description: Inverter serial. Omit if only one inverter is configured.
      required: false
      example: "2601234567"
      selector:
        text:
    enabled:
      name: Enabled
      description: Turn Time Of Use on or off.
      required: true
      selector:
        boolean:
    days:
      name: Days
      description: Weekdays the schedule is active. Omit for every day.
      required: false
      selector:
        select:
          multiple: true
          options:
            - MONDAY
            - TUESDAY
            - WEDNESDAY
            - THURSDAY
            - FRIDAY
            - SATURDAY
            - SUNDAY

set_grid_peak_shaving:
  name: Set grid peak shaving
  description: >-
    Turn grid peak shaving on or off, optionally with a new limit. While it is
    on, power drawn from the grid is held under the limit and the battery and PV
    cover the rest. The Deye Cloud API has no field for this setting, so it is
    an action rather than an entity; the inverter confirms each command.
  fields:
    device_id:
      name: Inverter
      description: The inverter to change. Omit if only one inverter is configured.
      required: false
      selector:
        device:
          integration: deye_cloud
    device_sn:
      name: Device serial
      description: Inverter serial, as an alternative to picking the device.
      required: false
      example: "2601234567"
      selector:
        text:
    enabled:
      name: Enabled
      description: Turn grid peak shaving on or off.
      required: true
      selector:
        boolean:
    power:
      name: Power limit
      description: Grid power limit in watts. Omit to keep the current limit.
      required: false
      example: 3000
      selector:
        number:
          min: 0
          max: 30000
          step: 100
          unit_of_measurement: W
          mode: box
