name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: test (${{ matrix.home-assistant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - home-assistant: latest
            python: "3.13"
            framework: '"pytest-homeassistant-custom-component"'
          # Oldest supported release (hacs.json): Home Assistant 2024.12.0
          - home-assistant: "2024.12.0"
            python: "3.12"
            # Pins keep period-correct josepy and pycares for that release.
            framework: '"pytest-homeassistant-custom-component==0.13.190" "josepy<2" "pycares<4.9"'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt ${{ matrix.framework }}
      - run: pytest -q
